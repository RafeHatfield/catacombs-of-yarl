past_sasha_encounter.looted_body:
  - "Sasha a la Tuesday. A bold vintage. Notes of acid, regret, and one bad decision regarding a troll."
  - "This one's the candle Sasha. He had a theory. The troll was unconvinced."
  - "Boss. Don't look at the face. The dungeon was not gentle with him on the way down."
  - "The corridor Sasha. He thought it was clear. It was, briefly, in the technical sense."

past_sasha_encounter.looted_body.on_loot:
  - "Take what's left. He won't mind. He didn't mind anything, by the end."
  - "The dungeon kept the better half. Of course it did. It always does."
  - "Boss. The dagger. He carried it for nine floors. It deserves to come back up."

past_sasha_encounter.quipping_shade.before:
  - "Boss. Look. He stayed."
  - "He's been waiting. Don't ask me how I know that."
  - "Boss. Careful. He has something to say."

past_sasha_encounter.quipping_shade.after:
  - "He always was the funny one. We both were."
  - "He remembered. So did I."
  - "Don't dwell, Boss. He didn't."

past_sasha_encounter.possessed_corpse.identify:
  - "Boss. Stop. That one's not yours anymore."
  - "That's the file the Under-Warden opened on you. He reads it now and then."
  - "Boss. The body is wrong. Don't engage yet."

past_sasha_encounter.possessed_corpse.pre_spell_break:
  - "I can break it. I can. Get me line of sight and a half-second."
  - "The Under-Warden's grip is procedural. Procedural things break."

past_sasha_encounter.possessed_corpse.post_spell_break:
  - "That wasn't you anymore, Boss. You can have the gear back now."
  - "Done. He's at rest. Take what's his. Yours. His."
  - "Boss. Take a breath. The dispel held. The body's quiet."

# ── Batch 1a/1b: taxonomy triggers (scheduler pending; pools sized for
#    once-per-run-per-line semantics the future ribbon scheduler will enforce) ──

# ── HP thresholds (index 0 = canon first-fire) ──

hp_threshold.25:
  - "Boss. You're leaking."
  - "A quarter left, Boss. I'm counting even if you're not."
  - "Boss. Bind that. It's not getting shallower."
  - "That one landed, Boss. Stop pretending it didn't."

hp_threshold.10:
  - "Boss. BOSS. Drink something."
  - "Ten percent, Boss. That's a number I don't say twice."
  - "Boss. Now. Whatever you're saving, this is what for."
  - "Don't make me do the pull, Boss. Drink."

hp_threshold.1:
  - "Goodbye."
  - "Boss."
  - "Stay."

# ── Region first-entry (keys land as authored; region scheme ruling pending — see PR-description note) ──

region_first_entry.boundary:
  - "This is the Boundary. The Unshriven hold it because they have to. We pass through because we have to. Try not to make friends."
  - "The Boundary, Boss. The orcs keep the line so the deeper things stay deep. Walk like a guest."

region_first_entry.dimhalls:
  - "The Dimhalls. The lamps down here gave up before I was bound. Watch your feet."
  - "Dimhalls, Boss. Everything here is between places. Don't be one of them."

region_first_entry.crossing:
  - "The Crossing. There was traffic through here once. Good freight-work on those arches. I knew the style."
  - "Halfway, Boss. The Crossing. From here down, the Paths stop pretending to be a place."

region_first_entry.inner_court:
  - "Inner Court, Boss. Mind your manners. Everything down here has a title."
  - "The Inner Court. The stonework gets proud from here on. So does everything else."

region_first_entry.weighing:
  - "The Weighing, Boss. They audit souls down here. Try not to look like inventory."
  - "Last region, Boss. Whatever you owe, it gets counted here. Walk straight."

# ── Trap first-of-type (keys = the 9 PoC-canonical TrapType values in FloorTrapComponent.cs) ──

trap_first.spike_trap:
  - "Spikes, Boss. The floor's honest down here. It hates you openly."
  - "Spike plate. Old work, still sharp. Someone maintains these. Step wide."

trap_first.fire_trap:
  - "Flame trap, Boss. Thermal trigger. I've built cleaner, but it works."
  - "Fire, Boss. Mind the reagents on your belt. They mind you back."

trap_first.acid_trap:
  - "Acid. On purpose, I hope."
  - "Acid pool, Boss. It doesn't want you. It just doesn't move for anyone."

trap_first.web_trap:
  - "Webbing. It won't stop you, Boss. It makes you late."
  - "Web, Boss. Everything down here is patient. Now you have to be."

trap_first.alarm_plate:
  - "Alarm plate. Nothing's hurt but your anonymity, Boss. Expect company."
  - "Alarm. The floor just took attendance, Boss. You're marked present."

trap_first.root_trap:
  - "Roots, Boss. Nothing grows down here on its own. Somebody planted these."
  - "Root trap. The floor's holding your ankle, Boss. It doesn't want anything. It was told to."

trap_first.teleport_trap:
  - "Teleport plate. Look around before you ask questions, Boss."
  - "Teleporter, Boss. Wherever we are, the map's wrong now. Start over."

trap_first.gas_trap:
  - "Gas, Boss. Hold your breath and move. Argue with me later."
  - "Gas trap. If the air tastes like coins, Boss, stop tasting it."

trap_first.hole_trap:
  - "Hole trap. The fast way down, Boss. Nobody chooses it twice."
  - "A hole. Gravity's honest work, Boss. Everything else down here should take notes."

# ── Kill streak ≥5 no-damage (≤3 fires/run) ──

kill_streak_clean:
  - "Showing off, are we."
  - "Five clean, Boss. Don't get poetic about it."
  - "Clean work. I saw. Don't ask me to say it twice."
  - "That's a streak, Boss. Streaks end. Plan for the ending."
  - "Efficient. I'd say I taught you that, but you'd argue."
  - "Not one scratch. Somewhere the Under-Warden is amending a file."

# ── Long idle (20+ silent turns; ≤3 fires/run) ──

long_idle:
  - "Any decade now, Boss."
  - "Boss. The floor isn't going to descend itself."
  - "Still here. Both of us. One of us on purpose."
  - "I've counted the bricks, Boss. Twice. Move."
  - "Take your time. The dead do."
  - "Boss. If we're camping, say so. I'll start identifying things."

# ── Species first-sight (keys = entities.yaml monster ids; excludes troll_probe_* fixtures) ──

species_first_sight.orc:
  - "Unshriven. He'd rather be fighting what's below, Boss. You'll do."
species_first_sight.orc_grunt:
  - "Orc, Boss. A soldier on the wrong shift. It's not personal. Duck anyway."
species_first_sight.orc_brute:
  - "Brute. Built like the argument's over, Boss. Don't reopen it."
species_first_sight.orc_scout:
  - "Scout, Boss. He's not hiding. He's letting you know they know."
species_first_sight.orc_veteran:
  - "Veteran, Boss. The armor's patched in eight places. He earned all eight."
species_first_sight.orc_skirmisher:
  - "Skirmisher, Boss. He moves more than you do. I know. Insulting."
species_first_sight.orc_shaman:
  - "Shaman. Orcs sing at their work, Boss. The quiet ones are doing the other kind."
species_first_sight.orc_chieftain:
  - "Chieftain, Boss. Somebody has to give the orders. The orders stop when he does."
species_first_sight.troll:
  - "Troll. Everything you spend on it comes back with interest, Boss. Bad loan."
species_first_sight.troll_ancient:
  - "Ancient troll. The young ones grow back, Boss. This one's had practice being killed."
species_first_sight.skeleton:
  - "Skeleton. Whoever it was is long gone. What's left still bites."
species_first_sight.zombie:
  - "Zombie. Nobody's home, Boss. You're arguing with a door."
species_first_sight.plague_zombie:
  - "Plague-carrier, Boss. The bite outlives the biter. Decline it."
species_first_sight.wraith:
  - "Wraith. It won't cut you, Boss. It subtracts you."
species_first_sight.lich:
  - "Lich. He did this to himself on purpose, Boss. Never trust anything that volunteered."
species_first_sight.necromancer:
  - "Necromancer. Every corpse in the room is on his side, Boss. Mind the floor."
species_first_sight.plague_necromancer:
  - "Plague-necromancer, Boss. Same trade as the other kind. Uglier product."
species_first_sight.cultist_blademaster:
  - "Blademaster, Boss. That stance is trained. Whoever taught him knew steel."
species_first_sight.cave_spider:
  - "Cave spider. Venom, Boss. Small bites add up. So do small spiders."
species_first_sight.web_spider:
  - "Web spider. It doesn't need to catch you, Boss. It needs you slower."
species_first_sight.giant_spider:
  - "Giant spider. Everything the small one does, Boss, with conviction."
species_first_sight.fire_beetle:
  - "Fire beetle. It's a lamp that hates you, Boss. Don't stand in the glow."
species_first_sight.slime:
  - "Slime. Acid, Boss. It ruins gear before it ruins you. Priorities."
species_first_sight.large_slime:
  - "Large slime, Boss. Same argument as the small one, louder."
species_first_sight.greater_slime:
  - "Greater slime. That one's eaten things with names, Boss. Stay out of reach."

# ── Item identified (per-category; agnostic to identification method) ──

item_identified.potion:
  - "Potion, named. One less gamble on the belt, Boss."
  - "Sorted, Boss. Drink with confidence. Well. With more confidence."
  - "Brewed properly, whatever else, Boss. Someone down here keeps their standards."
  - "Named, Boss. Knowledge is cheap when it isn't urgent. Stock up."
  - "That's settled. Label it in your head, Boss. I've labeled it in mine."
  - "Identified. The good ones announce themselves eventually, Boss. So do the others."
  - "Another potion off the mystery shelf, Boss. The shelf stays full down here."
  - "Known, Boss. Now it's equipment. Before, it was a bet."
  - "That one's honest now, Boss. It wasn't lying before. You just weren't listening right."
  - "Filed, Boss. Somebody taught me to keep a ledger of these. I keep it."

item_identified.scroll:
  - "Scroll, named, Boss. The words were always there. Now they're yours."
  - "Sorted. Whoever scribed that had a steady hand, Boss. Respect the penmanship."
  - "Named, Boss. Paper keeps its secrets badly. Everything else down here keeps them better."
  - "That's one more thing you can read, Boss. Literacy pays. Eventually."
  - "Identified. Careful with the ones that read back, Boss."
  - "Known, Boss. Ink fades. What it did to the last reader doesn't."
  - "Scroll's sorted. File the wording away, Boss. Wording matters down here."
  - "Named. The Paths run on paperwork, Boss. Now you hold some."
  - "That one's yours now, Boss. Knowledge signed for is knowledge owed."
  - "Identified, Boss. Read it like you mean it. The scroll can tell."

item_identified.wand:
  - "Wand, named. Good core, lazy finish, Boss. I'd have sanded it."
  - "Identified. It's not conscious, Boss. I checked."
  - "Named, Boss. Point the working end away from us. That's the whole trade."
  - "Sorted. A wand's a promise with a handle, Boss. Now you know what it promised."
  - "Sorted, Boss. Hold it like you mean it. Tools can tell."
  - "Named. Whoever wound the core knew the old method, Boss. It'll hold."
  - "Identified, Boss. Charges are a budget. Spend like it."
  - "Known. It does one thing well, Boss. That's a career down here."
  - "Wand, sorted. Mind the grip wear, Boss. Its last owner used it plenty. Consider why."
  - "Named, Boss. Don't tap it when it's slow. They hate that."

item_identified.ring:
  - "Ring, named. Fine work, Boss. Small things take the most skill."
  - "Identified. Wear it or trade it, Boss. Don't collect. Collectors die heavy."
  - "Named, Boss. Jewelry with a job. The best kind."
  - "Sorted. Whoever sized that had thin fingers and patience, Boss."
  - "Known. A ring works while you sleep, Boss. Respect the work ethic."
  - "Ring's named, Boss. Small weight, long lever."
  - "Identified. Metal remembers being shaped, Boss. This one was shaped kindly."
  - "Sorted, Boss. One finger's worth of advantage. Take every finger you can get."
  - "Named. Somebody loved this once, Boss. It ended up down here anyway."
  - "Known, Boss. Put it on or pocket it. Either way it's done being a question."

# ── Overnight identification (mechanic unimplemented; forward-authored, content-only) ──

overnight_identified:
  - "Morning, Boss. Worked that one out while you snored. You're welcome."
  - "Solved it overnight, Boss. The dark's good for thinking. It's most of what I do."
  - "One mystery fewer, Boss. Call it rent."
  - "Sorted it while you slept. Slow work, Boss, done right. The best kind."
  - "Morning. I named your mystery, Boss. It behaved once it was named. Most things do."
  - "Night shift's done, Boss. One item, fully understood. Some nights that's everything."
  - "Worked it out by feel, Boss. The old way. It still works."
  - "That one fought me till the third bell, Boss. I won. I usually win."
  - "Done overnight, Boss. You slept through good craftsmanship. Typical."
  - "Named it in the dark, Boss. Things confess quicker when it's quiet."
  - "Item's sorted, Boss. The Paths talked in their sleep again. I tried not to listen."
  - "One more named, Boss. Somebody had to know these things. Now it's me. Then you."
  - "Overnight work, Boss. No rush jobs. The dead don't buy, but they judge."
  - "Solved, Boss. It's honest work if you can get it. I got it."
  - "Morning. Your mystery's a tool now, Boss. Best trade there is."
  - "Sorted by dawn, Boss. I'd have finished sooner, but you snore in E flat."

# ── On death: killer species (cause "monster" + PlayerDeathKillerSpecies) ──

on_death.orc:
  - "An Unshriven, Boss. He didn't enjoy it. Small comfort. It's what I have."
on_death.orc_grunt:
  - "The line held, Boss. That's all he was doing. The line held."
on_death.orc_brute:
  - "The brute, Boss. I said don't trade hits. You traded."
on_death.orc_scout:
  - "He counted you first, Boss. The count came due."
on_death.orc_veteran:
  - "The veteran, Boss. Ninth patch. I hate that I noticed."
on_death.orc_skirmisher:
  - "The flank, Boss. He asked for it all fight. You finally answered."
on_death.orc_shaman:
  - "The quiet work finished, Boss. I heard it starting. I wasn't loud enough."
on_death.orc_chieftain:
  - "The chieftain, Boss. The orders held. Ours didn't."
on_death.troll:
  - "The loan came due, Boss. I do the accounts. I should have called it."
on_death.troll_ancient:
  - "The old one, Boss. Practice won. It usually does. I hoped anyway."
on_death.skeleton:
  - "Bones, Boss. It forgot everything it was and still remembered how. Unfair."
on_death.zombie:
  - "The door won, Boss. Doors shouldn't win."
on_death.plague_zombie:
  - "The bite outlived you both, Boss. I said decline it."
on_death.wraith:
  - "Subtracted, Boss. All the way down. I counted what it took. Everything."
on_death.lich:
  - "The volunteer got you, Boss. He had centuries. You had me. Not enough."
on_death.necromancer:
  - "The floor took his side, Boss. I watched it happen. I'm still watching."
on_death.plague_necromancer:
  - "His product held, Boss. I called it ugly. Ugly works."
on_death.cultist_blademaster:
  - "Trained steel, Boss. His teacher would be proud. Mine would understand."
on_death.cave_spider:
  - "Small bites, Boss. They added up. I did the adding too late."
on_death.web_spider:
  - "Slower was enough, Boss. It only ever needed slower."
on_death.giant_spider:
  - "It had conviction, Boss. I wanted it to be wrong."
on_death.fire_beetle:
  - "You stood in the glow, Boss. I won't say I told you. I told you."
on_death.slime:
  - "The gear went first, Boss. Then the priorities stopped mattering."
on_death.large_slime:
  - "The loud argument won, Boss. I ran out of rebuttals."
on_death.greater_slime:
  - "It has your name now, Boss. That's how it gets the names."

# ── On death: hazard (cause "hazard"; no sub-type recorded) ──

on_death.hazard:
  - "No enemy, Boss. Just the Paths being the Paths. I hate that it counts."
  - "The Paths did this one themselves, Boss. No middleman. They don't even gloat."
  - "The architecture won, Boss. It was always going to get one of us."
  - "The ground did it, Boss. I scout ahead. I missed it. That's mine."

# ── On death: fallback (any unmatched cause, incl. Weighing losses) ──

on_death:
  - "It's done, Boss. I'll keep the account. I keep all of them."
  - "Rest, Boss. The next part is mine."
  - "Not this. Not again."

# ── Spell-break used (successful non-possession dispel; combat surface, lines kept short) ──

spell_break_used:
  - "Broken."
  - "Done. Next."
  - "That one snapped clean, Boss."
  - "Cheap work. It came apart cheap."
  - "Unmade. I do the unmaking around here."
  - "There. It never fit him anyway."
  - "Broken, Boss. Whoever cast that cut corners."
  - "Snapped. Good thread, bad knot."
  - "It's mine now. It's nothing now."
  - "Off. Like a bad label."
  - "Broken. It argued. Briefly."
  - "Undone, Boss. Clean edges. You're welcome."
  - "Gone. The Paths can bill me."
  - "Snapped, Boss. I know the maker's style. Knew."
  - "Broken. Some knots want to be found."
  - "There, Boss. Enchantment's just a promise. I break promises."
  - "Done. That one had a signature. Sloppy one."
  - "Unpicked. Slow hands somewhere are ashamed."
  - "Broken, Boss. Point me at the next lie."
  - "Off him. Spells stick to the desperate."
  - "Snapped. I felt where it was thin."
  - "Done, Boss. Old binding. Older than it should be."
  - "Broken. Give me a moment. Joke. Go."
  - "Unmade. Nothing holds if I say so."
  - "Broken, Boss. That's the whole trade. Breaking and knowing where."

# ── Between-runs (results screen). Selection contract:
#    docs/systems/between_runs_conditioning.md. Selector unbuilt.
#    Milestone keys are depth-1 by design; key = fired-set line id. ──

between_runs.milestone.run_1:
  - "So that's the shape of it, Boss. Again tomorrow. I'll be here. I'm always here."
between_runs.milestone.run_2:
  - "Twice now. It gets easier to start and never easier to stop. Rest first."
between_runs.milestone.run_3:
  - "Third time, Boss. This is officially work now. Work suits us."
between_runs.milestone.run_10:
  - "Ten runs, Boss. I've stopped counting the doors. I still count you down and back. Every time."
between_runs.milestone.run_25:
  - "Twenty-five, Boss. You know the Paths better than most of their staff. They've noticed. So have I."
between_runs.milestone.run_50:
  - "Fifty, Boss. Some bindings are terms. This stopped being terms a while ago. Go to bed. I'll keep the light."

between_runs.died.unshriven:
  - "Soldiers, Boss. It wasn't malice. Somehow that's worse to file."
  - "The line held again. They'll sing about holding it. Not about you. Rest."
  - "An honest death, as they go. The Unshriven don't do the other kind."
  - "They fight like people with something behind them, Boss. We fight like people with something below. Bad trade some days."
between_runs.died.undead:
  - "The dead won today, Boss. They have the numbers. They always have the numbers."
  - "What's below doesn't tire, Boss. You do. That's not a flaw. Rest anyway."
  - "Lost to the quiet kind. The Paths keep them fed. Don't think about with what."
  - "The dead don't win, Boss. They just wait better. Learn the waiting."
between_runs.died.beast:
  - "Eaten, technically. The Paths don't stand on ceremony. Neither do the things in them."
  - "Small things, Boss. It's always the small things. Big ones announce."
  - "The wildlife won this one. No grudge in it. Doesn't help, I know."
  - "Something hungry got lucky, Boss. Hunger's patient down there. Be patienter."
between_runs.died.cultist:
  - "Trained hands, Boss. Somebody's still teaching down there. That's the worrying part."
  - "The robes got you. They believe in something. You just owe something. Believers swing harder."
  - "Steel with a doctrine behind it, Boss. Doctrine's just practice with an excuse."
between_runs.died.hazard:
  - "The Paths themselves today, Boss. No author, no apology. File it under architecture."
  - "Nothing killed you, technically. The floor just stopped agreeing to hold you. I hate this place professionally."
  - "No enemy to blame, Boss. That's the Paths' idea of a joke. Nobody laughs."

between_runs.died.band_1:
  - "Shallow end, Boss. Everyone drowns somewhere before they swim. Again tomorrow."
  - "Five floors is still down, Boss. Down doesn't grade on effort. We'll fix the start."
  - "Early exit, Boss. The Paths see everyone twice. They've seen worse twice too."
between_runs.died.band_2:
  - "Middle-shallow, Boss. Far enough to cost, close enough to sting. Both fade."
  - "Ten floors is real work, Boss. The Paths took it personally. Take that as flattery."
  - "You're past the tourist depths now. The Paths noticed. That's the price of being noticed."
between_runs.died.band_3:
  - "Halfway down, Boss. The Paths stop being a place around there. You saw it. It saw back."
  - "Fifteen deep. Most ledgers close shallower. Yours stays open. Rest first."
  - "Deep enough that the maps get honest, Boss. So does the danger. Fair trade. Mostly."
between_runs.died.band_4:
  - "Deep run, Boss. Titles and pride down there, and you walked through most of it."
  - "Twenty floors is knocking on the audit, Boss. They heard. Next time we answer properly."
  - "Past the proud stonework. Few get there. Fewer file back out. We'll be both."
between_runs.died.band_5:
  - "The doorstep, Boss. You died within paperwork's reach of the desk. That's not nothing. It's nearly everything."
  - "Almost the desk itself. The Paths spend their best on the last five floors. So did you."
  - "That deep, the dying's almost administrative, Boss. Next time we bring the right forms."

between_runs.weighing_loss:
  - "The Weighing went against us, Boss. Audits do. The record's still ours to amend."
  - "Lost at the desk itself. The scales don't hate you. They don't anything. That's what makes them beatable."
  - "The Weighing keeps what it weighs, Boss. It didn't keep you. Read that again. Then rest."

between_runs.survived.clean_audit:
  - "A clean audit, Boss. Stamped and closed. Buy me something shiny."
  - "Debts paid, doors held, desk satisfied. I'd frame the paperwork, but I lack the arms."
  - "Out clean. The stairs pretended to end, and this once we let them. Well worked, Boss."
between_runs.survived.theft:
  - "You stole from an auditor, Boss. I'm appalled. I'm also keeping the receipt."
  - "The defiant exit. The ledger will remember. Good. Let it."
  - "Taken, not granted, Boss. Some things you don't wait to be owed. Rest. We're wanted now."
between_runs.survived.swap:
  - "You offered instead, Boss. Nobody offers. Almost nobody. Now there are two of you."

between_runs:
  - "Run's filed, Boss. Rest. The Paths keep."
  - "Done for today. The account stays open. So do I."
  - "That's the run, Boss. No summary from me. The memo people have that covered."
  - "Rest, Boss. Down there keeps. It always keeps."
  - "Another one for the ledger. Sleep first. Arithmetic after."
  - "Closed for the day, Boss. Same door tomorrow. It'll pretend it never saw us."
