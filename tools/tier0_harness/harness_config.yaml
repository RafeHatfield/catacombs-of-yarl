# Tier 0 review harness — the apparatus that judges art (ART-BIBLE-v0 §13.1).
#
# READ THIS BEFORE CHANGING A NUMBER.
#
# Values here fall into exactly two classes, and they are labelled, because the difference
# decides whether a capture means anything:
#
#   RULED       — decided, with the ruling named. Changing one is a ruling, not an edit.
#   UNDERIVED   — the bible marks it PLACEHOLDER. It has a design purpose and NO derived value.
#                 It is here because the harness cannot run without *some* number, not because
#                 this number is right. It is not law, it is not a gate, and it must not be
#                 cited as a derived value. ART-BIBLE-v0 §4.3, §6.2.
#
# Every UNDERIVED value below is echoed into the capture log of every run, so no capture can
# circulate without carrying the unratified numbers that produced it.

resolution:
  # RULED — ART-BIBLE-v0 §4.1: reference device is iPhone SE (2nd/3rd gen), 750x1334, portrait.
  # This is the SE's physical (@2x) pixel resolution; logical points are 375x667.
  # Same value as tools/art_lint/scene_capture_config.yaml, which the retired Oryx track also
  # used — the device ruling survived that track's closure and is re-adopted on its own merits.
  width: 750
  height: 1334

tile:
  # RULED (Rafe, 2026-08-25) as to VALUE; still PLACEHOLDER in the bible as to DERIVATION.
  #
  # ART-BIBLE-v0 §4.3 marks canvas and tile sizes PLACEHOLDER: "Native canvas per layer, and the
  # integer scale factor to logical pixels, are derived at Phase 5 against the reference device."
  # That derivation has NOT happened. What has happened is a ruling, taken with its gravity
  # acknowledged: the §6.4 probe's survivors become the seed corpus, and the seed corpus canvas
  # becomes the de facto game canvas — so 32x32 native at x2 is expected to be ratified at tier 1
  # unless the pilot rejects it. Recorded here as a RULING, never cited as a derived value.
  #
  # Rationale on record: ~11.7 tiles across the reference device's 750px width at x2 (more than
  # 24x3's ~10.4, not fewer); half the craft gap to the 48px asset bar closed; room for two-plane
  # wall faces (§3) and Sasha's attachment points (§10.1).
  #
  # The previous value was 24 — the Oryx 16bf world tile size inherited from the closed track,
  # which was never a derived value either.
  #
  # THE KNOWN LIMIT THAT USED TO LIVE HERE IS CLOSED. TopDownRenderer's 24 was a hard-coded
  # constant, so this key could declare any number and the renderer would still draw a 24px grid
  # — the config and the capture could disagree silently. Tile size is now a genuine engine
  # parameter (--tile-size / --tile-scale), capture_corridor.py passes both, and Main echoes what
  # it actually used into every capture log.
  size: 32
  # The integer scale from native pixels to logical pixels. §4.3 LOCKED: "Integer scaling only;
  # no fractional scaling baked into any asset." Becomes the renderer's DefaultZoom; MinZoom and
  # MaxZoom follow as scale/2 and scale*2, which reproduce the previous 1.5/6.0 at the old 3.0.
  scale: 2.0
  status: RULED (value) / PLACEHOLDER (derivation) — ART-BIBLE-v0 §4.3

light:
  # ============================================================================================
  # RULED (Rafe, 2026-08-28, at the §6.2.1 gate). RULING 56 — THE BOUNDARY'S RIG.
  #
  # ART-BIBLE-v0 §6.2 read "Only the Boundary's values are derived at the pilot. The rest are
  # PLACEHOLDER" — and the Boundary's were not derived either. They are now. **The PLACEHOLDER is
  # CLEARED FOR THE BOUNDARY AND FOR NOTHING ELSE**: every other region derives its own at its own
  # gate, and copying these into one would be conformance to a neighbouring region's answer.
  #
  # Ratified by walking the tier-one floor family on the reference device (iPhone SE 3rd gen) at
  # gameplay distance, per §6.2.1's requirement that the rig is tuned for readability BEFORE any
  # asset is judged through it. Evidence: tools/tier1_floors/evidence/DEVICE-tier1-boot.log.
  #
  # THE UNITS, STATED, because a knob position is not a value and "ambient 0.7" alone is
  # ambiguous — 0.7 of what:
  #
  #   radius_tiles   5.0    REACH IN TILES, never pixels. At the RULED 32px tile that is a 320px
  #                         radius / 640px light texture. Tiles rather than pixels so the number
  #                         does not silently hard-code §4.3's still-PLACEHOLDER tile size.
  #   falloff        1.00   EXPONENT on the radial ramp `(1 - smoothstep(0,1,d))^falloff`.
  #                         1.00 is the identity curve — the plain smoothstep. Above 1 pulls the
  #                         pool in tight; below 1 carries light out to the radius. Ratified AT
  #                         the identity, which is a decision and not an absence of one.
  #   ambient_level  0.70   SCALAR on the ambient HUE below, not a colour. Multiplies each
  #                         channel: #1a1a22 x 0.70 -> rgb(18,18,24) = #121218, which is the
  #                         CanvasModulate actually applied. Hue is held and only brightness
  #                         moves, so a readability pass cannot restyle the region (§6.2.1).
  #   ambient        1a1a22 the HUE. Unchanged by the pass.
  #   color          ffb066 carried-fire warmth (§6.2 "warm"). Unchanged by the pass.
  #   energy         1.6    PointLight2D energy. Unchanged by the pass; 0.0 remains the
  #                         "lighting is live" positive control.
  #
  # ⚠ THIS FIRES §6.2's RE-DERIVATION RULE. "Every authored ratio derived against the current rig
  # is RE-DERIVED when §6.2's PLACEHOLDER values are ratified." The rig moved — radius 5.5 -> 5.0,
  # ambient 1.0 -> 0.7 — so the sighted round's wall recipe, which authored face/top at ~0.35 to
  # deliver 0.52 through the OLD numbers, is now compensating against a rig that no longer exists.
  # Those walls were culled at the 2026-08-27 gate and are not in the tier-one scene, so nothing
  # shipping depends on it; the stale compensation is recorded in WALL-RECIPE.md rather than
  # silently carried. The tier-one FLOOR family derives no ratio against the rig at all — its
  # values come from the measured donor material — so it needs no re-derivation.
  ambient: "1a1a22"        # RULED (hue) — Ruling 56
  ambient_level: 0.70      # RULED — Ruling 56. Scalar on the hue; effective CanvasModulate #121218
  color: "ffb066"          # RULED — Ruling 56, carried-fire warmth (§6.2 "warm")
  energy: 1.6              # RULED — Ruling 56
  radius_tiles: 5.0        # RULED — Ruling 56. Reach in TILES.
  falloff: 1.00            # RULED — Ruling 56. Exponent on the radial ramp; 1.00 is identity.
  status: RULED (Boundary only) — Ruling 56, Rafe, 2026-08-28. Other regions derive their own.

scene:
  # The corridor spec. Geometry is authored data (see corridor_junction.json) so the shape of
  # the junction is a review-time decision, not a code change.
  spec: src/Presentation/assets/tier0_harness/scenes/corridor_junction.json

probe:
  # ART-BIBLE-v0 §6.4 runs a three-arm receive-light probe immediately after this session.
  # Each arm is a different AUTHORING of the same fragment, rendered under IDENTICAL lighting —
  # so an arm is just a different tile directory, selected by pointing the theme config at it.
  # The harness renders arms through one code path with one light rig; nothing else varies.
  #
  #   A — baked directional key light   (positive control: the conventional approach)
  #   B — no key light, form shading retained  (the likely answer)
  #   C — flat, material value only     (the strict reading of §6.3)
  #
  # NO ARM ART EXISTS. These point at stub directories so the mechanism is exercised and proven
  # before any asset is drawn. Generating the arms is the NEXT session's work, not this one's.
  # Arm tile dirs live under src/Presentation/assets/ and NOT under tools/, because
  # tools/.gdignore makes the whole tools/ tree invisible to Godot's importer — an asset there
  # can never be rendered. (This is why the retired Oryx review path had to overwrite live
  # sprite files in place and revert afterwards; pointing the theme config at a Godot-visible
  # directory removes that whole mechanism.)
  arms:
    A: src/Presentation/assets/tier0_harness/arm_A
    B: src/Presentation/assets/tier0_harness/arm_B
    C: src/Presentation/assets/tier0_harness/arm_C
